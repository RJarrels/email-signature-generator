name: Deploy Email Signature Images

on:
  push:
    branches:
      - main
      - uat
    paths:
      - "infra/**"
      - "images/**"
      - ".github/workflows/deploy-images-cdn.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy-infra:
    name: Deploy CDK Stack
    runs-on: ubuntu-latest
    outputs:
      bucket-name: ${{ steps.cdk-outputs.outputs.bucket-name }}
      bucket-url: ${{ steps.cdk-outputs.outputs.bucket-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CDK_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: infra
        run: npm install

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Extract CDK outputs
        id: cdk-outputs
        working-directory: infra
        run: |
          echo "bucket-name=$(jq -r '.EmailSignatureImagesStack.BucketName' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "bucket-url=$(jq -r '.EmailSignatureImagesStack.BucketUrl' cdk-outputs.json)" >> "$GITHUB_OUTPUT"

  sync-images:
    name: Sync Images to S3
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CDK_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync images to S3
        run: |
          aws s3 sync images/ "s3://${{ needs.deploy-infra.outputs.bucket-name }}/images/" \
            --cache-control "public, max-age=31536000" \
            --delete

      - name: Print bucket URL
        run: |
          echo "::notice::Image base URL: ${{ needs.deploy-infra.outputs.bucket-url }}/images/"
